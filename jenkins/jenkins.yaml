jenkins:
  systemMessage: Jenkins configurado como codigo con JCasC
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: Admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy: loggedInUsersCanDoAnything

unclassified:
  location:
    url: ${JENKINS_PUBLIC_URL:-http://localhost:8080/}

credentials:
  system:
    domainCredentials:
      - credentials:
          # Usuario y contraseña de la base de datos de los contenedores de prueba.
          # Se toman de DB_USER y DB_PASSWORD del archivo .env (no versionado).
          - usernamePassword:
              scope: GLOBAL
              id: orders-db
              description: Credenciales de PostgreSQL para los contenedores del pipeline
              username: ${DB_USER}
              password: ${DB_PASSWORD}

tool:
  jdk:
    installations:
      - name: 'JDK21'
        home: '/opt/jdk21'
  maven:
    installations:
      - name: 'Maven3'
        home: '/usr/share/maven'

jobs:
  - script: |
      // Branch to build; defaults to master (override with JENKINS_BRANCH in .env)
      def buildBranch = System.getenv('JENKINS_BRANCH') ?: '*/master'

      pipelineJob('integracion-continua-backend-orders-ci') {
        description('Pipeline de integracion continua para orders-ci (rama ' + buildBranch + ')')
        properties {
          pipelineTriggers {
            triggers {
              // Poll SCM: consulta GitHub cada 2 minutos y construye si hay commits nuevos.
              pollSCM {
                scmpoll_spec('H/2 * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/Poligran-CI/orders-ci')
                }
                branch(buildBranch)
              }
            }
            scriptPath('Jenkinsfile')
            lightweight()
          }
        }
      }
